services:
  postgres:
    image: postgres:15.2
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://test:test@postgres:5432/test?sslmode=disable"
      - "up"

  service:
    image: ${SERVICE_IMAGE}
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      HTTP_PORT: "8080"
      LOGGER_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
